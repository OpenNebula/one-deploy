---
# Modular (socket-activated) libvirt is what the opennebula-node-kvm package
# sets up on RHEL/Alma 9+ since OpenNebula 7.4 (OpenNebula/one#7567) and on SUSE.
# Everywhere else the stand-alone (monolithic) libvirtd is used.
- name: Decide Libvirt mode (modular / stand-alone) and service name
  ansible.builtin.set_fact:
    libvirt_modular: "{{ _libvirt_modular }}"
    libvirt_service: "{{ 'virtqemud' if _libvirt_modular else 'libvirtd' }}"
  vars:
    _libvirt_modular: >-
      {{ ansible_os_family in ['Suse']
         or (ansible_os_family in ['RedHat'] and one_version is version('7.4', '>=')) }}

# --- Socket-activated Libvirt -> https://github.com/OpenNebula/one/issues/7567 ---

- when: libvirt_modular
  block:
    - name: Unmask virtqemud*/virtproxyd* units (socket-activation)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
      register: result
      failed_when:
        - result is failed
        - result.status.LoadState is defined and result.status.LoadState != 'not-found'
      loop:
        - virtqemud.service
        - virtqemud.socket
        - virtqemud-admin.socket
        - virtqemud-ro.socket
        - virtproxyd.socket
        - virtproxyd-admin.socket
        - virtproxyd-ro.socket

    - name: Remove libvirtd.service override (stand-alone leftover)
      ansible.builtin.file:
        path: /etc/systemd/system/libvirtd.service.d/override.conf
        state: absent

    - name: Disable libvirtd* units (stand-alone leftover)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
        daemon_reload: true
      register: result
      failed_when:
        - result is failed
        - result.status.LoadState is defined and result.status.LoadState != 'not-found'
      loop:
        - libvirtd.service
        - libvirtd.socket
        - libvirtd-admin.socket
        - libvirtd-ro.socket

    - name: Enable Libvirt sockets (socket-activation)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - virtqemud.socket
        - virtqemud-ro.socket
        - virtnetworkd.socket
        - virtnodedevd.socket
        - virtsecretd.socket
        - virtstoraged.socket

- name: Configure libvirt (UUID + logging)
  ansible.builtin.lineinfile:
    path: "/etc/libvirt/{{ libvirt_service }}.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: '^[#\s]*host_uuid\s*=.*$'
      line: 'host_uuid = "{{ inventory_hostname | to_uuid }}"'
    - regexp: '^[#\s]*log_filters\s*=.*$'
      line: 'log_filters = "3:libvirt 3:qemu"'
    - regexp: '^[#\s]*log_outputs\s*=.*$'
      line: 'log_outputs = "2:syslog:{{ libvirt_service }}"'
  register: lineinfile

- name: Restart libvirt (NOW)
  ansible.builtin.service:
    name: "{{ libvirt_service }}"
    state: restarted
  when: lineinfile is changed

- name: Disable Libvirt's default network (optional)
  ansible.builtin.shell:
    cmd: |
      set -o errexit
      if virsh net-dumpxml default; then
        virsh net-destroy default ||:
        virsh net-autostart default --disable
      fi
    executable: /bin/bash
  changed_when: false
  when: disable_default_net | bool is true

# --- Stand-alone Libvirt ---

- when: not libvirt_modular
  block:
    # The modular virtproxyd.socket declares Conflicts=libvirtd.socket and listens on the
    # same libvirt-sock, at boot it can win the race and proxy to the masked virtqemud
    # -> https://github.com/OpenNebula/one-deploy/issues/304
    - name: Mask virtproxyd* sockets (stand-alone)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        masked: true
        state: stopped
      register: result
      failed_when:
        - result is failed
        - result.status.LoadState is defined and result.status.LoadState != 'not-found'
      loop:
        - virtproxyd.socket
        - virtproxyd-admin.socket
        - virtproxyd-ro.socket

    - name: Query raw status of virtqemud.service
      ansible.builtin.systemd_service:
        name: virtqemud.service
      register: systemd_virtqemud
      no_log: true

    - when: systemd_virtqemud.status.LoadState not in ['masked', 'not-found']
      block:
        - name: Mask virtqemud* units and libvirtd* sockets (stand-alone)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            masked: true
            state: stopped
          register: result
          failed_when:
            - result is failed
            - result.status.LoadState is defined and result.status.LoadState != 'not-found'
          loop:
            - virtqemud.service
            - virtqemud.socket
            - virtqemud-admin.socket
            - virtqemud-ro.socket

        - name: Create /etc/systemd/system/libvirtd.service.d/
          ansible.builtin.file:
            path: /etc/systemd/system/libvirtd.service.d/
            state: directory
            mode: u=rwx,go=rx

        - name: Override libvirtd.service
          ansible.builtin.copy:
            dest: /etc/systemd/system/libvirtd.service.d/override.conf
            mode: u=rw,go=r
            content: "[Service]\nEnvironment=LIBVIRTD_ARGS=\"{{ libvirtd_args }}\""
          register: copy

        - name: Restart libvirtd (NOW)
          ansible.builtin.systemd_service:
            name: libvirtd
            daemon_reload: true
            enabled: true
            state: restarted
          when: copy is changed

        - name: Check if virsh errors out
          ansible.builtin.shell:
            cmd: virsh -r -c qemu:///system capabilities
            executable: /bin/bash
          changed_when: false
          register: shell
          ignore_errors: true

        - name: Delete stale virtqemud* sockets (fix)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /var/run/libvirt/virtqemud-admin-sock
            - /var/run/libvirt/virtqemud-sock
            - /var/run/libvirt/virtqemud-sock-ro
          when: shell is failed

# --- AppArmor ---

- when: ansible_facts.apparmor.status | d('disabled') == 'enabled'
  block:
    - name: Check if AppArmor configuration exists
      ansible.builtin.stat:
        path: /etc/apparmor.d/abstractions/libvirt-qemu
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: stat

    - when: stat.stat.exists is true
      block:
        - name: Add permissions to AppArmor
          ansible.builtin.lineinfile:
            dest: /etc/apparmor.d/abstractions/libvirt-qemu
            line: "{{ item }}"
          loop:
            - "  /srv/** rwk,"
            - "  /var/lib/one/datastores/** rwk,"
          register: lineinfile

        - name: Reload apparmor
          ansible.builtin.service:
            name: apparmor
            state: reloaded
          register: result
          failed_when:
            - result is failed
            - result.msg is not contains("find")
            - result.msg is not contains("found")
          when: lineinfile is changed

    # Before libvirt 12.1.0, virt-aa-helper adds a "deny <backing-file> w," rule to the
    # per-VM AppArmor profile, which makes blockcommit (live VM backups) fail with
    # "Permission denied". Disable the security driver on affected nodes instead.
    # https://gitlab.com/libvirt/libvirt/-/work_items/806

    - name: Get libvirt version
      ansible.builtin.shell:
        cmd: virsh --version
        executable: /bin/bash
      changed_when: false
      register: virsh_version

    - name: Disable AppArmor confinement of QEMU domains (libvirt < 12.1.0)
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '^[#\s]*security_driver\s*=.*$'
        line: 'security_driver = "none"'
      register: lineinfile_qemu
      when: virsh_version.stdout | trim is version('12.1.0', '<')

    - name: Restore AppArmor confinement of QEMU domains (libvirt >= 12.1.0)
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '^security_driver\s*=\s*"none"\s*$'
        state: absent
      register: lineinfile_qemu_revert
      when: virsh_version.stdout | trim is version('12.1.0', '>=')

    - name: Restart libvirt (NOW)
      ansible.builtin.service:
        name: "{{ libvirt_service }}"
        state: restarted
      when: lineinfile_qemu is changed or lineinfile_qemu_revert is changed
