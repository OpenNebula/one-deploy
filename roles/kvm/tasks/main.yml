---
- when: node_hv in hv_types
  block:
    - tags: [preinstall]
      block:
        - ansible.builtin.include_role:
            name: repository
          vars:
            repos_enabled_defaults: [opennebula]
          when: opennebula_repo is undefined

        - name: Install OpenNebula KVM packages
          ansible.builtin.package:
            name: "{{ _common + _specific[ansible_os_family] }}"
          vars:
            _common: [opennebula-node-kvm]
            _specific:
              Debian: []
              RedHat: []
              Suse: []
          register: package
          until: package is success
          retries: 12
          delay: 5

    - ansible.builtin.import_tasks:
        file: "{{ role_path }}/tasks/libvirt.yml"
      tags: [libvirt]

    - ansible.builtin.include_role:
        name: opennebula/leader
      when: leader is undefined

    - name: Slurp oneadmin's pubkey
      ansible.builtin.slurp:
        path: /var/lib/one/.ssh/id_rsa.pub
      register: slurp
      delegate_to: "{{ leader }}"

    - name: Add oneadmin's pubkey to authorized keys
      ansible.posix.authorized_key:
        user: oneadmin
        key: "{{ slurp.content | b64decode }}"

    - delegate_to: "{{ leader }}"
      block:
        - name: Get Nodes
          ansible.builtin.shell:
            cmd: onehost list --json
            executable: /bin/bash
          changed_when: false
          register: shell

        - name: Add this KVM Node to OpenNebula
          ansible.builtin.shell:
            cmd: onehost create '{{ _this }}' -i '{{ hv_types[_hv].im_mad }}' -v '{{ hv_types[_hv].vmm_mad }}'
            executable: /bin/bash
          changed_when: true
          when: _host_pool is falsy or _this not in _node_names
          vars:
            _document: >-
              {{ shell.stdout | from_json }}
            _host_pool: >-
              {{ _document.HOST_POOL }}
            _node_names: >-
              {{ [_host_pool.HOST] | flatten | map(attribute='NAME') | list }}
            _this: >-
              {{ ansible_host | d(inventory_hostname) }}
            _hv: >-
              {{ node_hv | lower }}
          register: shell
          until: shell is success
          retries: 12
          delay: 5

        - when: host_template | length > 0
          block:
            - name: Get KVM host template
              ansible.builtin.command:
                cmd: onehost list --json
              changed_when: false
              register: host_list

            - name: Update KVM host template attributes
              ansible.builtin.shell:
                cmd: |
                  set +o errexit -o pipefail
                  TEMPLATE="$(mktemp)"
                  tee "$TEMPLATE"
                  cat "$TEMPLATE" | onehost update '{{ _host_name }}' -a "$TEMPLATE"; RC="$?"
                  rm -f "$TEMPLATE"
                  exit "$RC"
                stdin: |
                  {{ host_template | opennebula.deploy.to_one }}
                executable: /bin/bash
              changed_when: true
              when: _updated | opennebula.deploy.to_one
                    !=
                    _current | opennebula.deploy.to_one
              vars:
                _host_name: >-
                  {{ ansible_host | d(inventory_hostname) }}
                _hosts: >-
                  {{ [(host_list.stdout | from_json).HOST_POOL.HOST | d([])] | flatten }}
                _current: >-
                  {{ (_hosts | selectattr('NAME', '==', _host_name) | first).TEMPLATE | d({}) }}
                _updated: >-
                  {{ _current | combine(host_template, recursive=true) }}
