---
- name: Merge rsyslog dict with defaults
  ansible.builtin.set_fact:
    rsyslog: >-
      {{ rsyslog_defaults | combine(rsyslog, recursive=true) }}

- when: _managed
  vars:
    _managed: >-
      {{ (rsyslog.values() | selectattr('managed', 'undefined')
                           | count > 0)
         or
         (rsyslog.values() | selectattr('managed', 'defined')
                           | map(attribute='managed')
                           | map('bool')
                           | select
                           | count > 0) }}
    _service:
      Debian: rsyslog.service
      RedHat: rsyslog.service
      Suse: rsyslog.service
  block:
    - name: Detect rsyslog service (query raw status)
      ansible.builtin.systemd_service:
        name: "{{ _service[ansible_os_family] }}"
      register: systemd_rsyslog_service
      no_log: true

    - when: _enabled
      vars:
        _enabled: >-
          {{ [systemd_rsyslog_service] | selectattr('status.LoadState', 'defined')
                                       | rejectattr('status.LoadState', 'in', ['masked', 'not-found'])
                                       | selectattr('status.UnitFileState', 'defined')
                                       | selectattr('status.UnitFileState', 'in', ['enabled'])
                                       | count > 0 }}
      block:
        - name: Create /etc/rsyslog.d/
          ansible.builtin.file:
            path: /etc/rsyslog.d/
            state: directory
            owner: 0
            group: 0
            mode: u=rwx,go=rx

        - name: Render rsyslog configs
          ansible.builtin.copy:
            dest: "/etc/rsyslog.d/{{ item }}.conf"
            owner: 0
            group: 0
            mode: u=rw,go=r
            content: "{{ _content }}"
          vars:
            _content: |
              # managed by one-deploy
              {{ rsyslog[item].config }}
          when:
            - rsyslog[item].managed | d(true) | bool
          loop: "{{ rsyslog.keys() }}"
          register: copy_rsyslog_configs

        - name: Restart rsyslog (NOW)
          ansible.builtin.systemd_service:
            name: "{{ _service[ansible_os_family] }}"
            state: restarted
          when:
            - copy_rsyslog_configs is defined
            - copy_rsyslog_configs is changed
