---
- name: Install required OS packages
  ansible.builtin.package:
    name: "{{ _common + _specific[ansible_os_family] }}"
  vars:
    _common: [bash, coreutils, driverctl, grep, pciutils, psmisc]
    _specific:
      Debian: [iproute2]
      RedHat: [iproute]
      Suse: [iproute2]
  register: package
  until: package is success
  retries: 12
  delay: 5

- name: Parse pci_devices (user input)
  ansible.builtin.set_fact:
    pci_devices: >-
      {%- set output = [] -%}
      {%- for v in pci_devices -%}
        {%- if v.address is undefined -%}
          {{-
            output.append(v | combine({
              "key": "{}:{}:{}".format(
                v.vendor | d('*'),
                v.device | d('*'),
                v.class | d('*'),
              ) | lower,
              "key_type": "vdc",
            }))
          -}}
        {%- else -%}
          {%- if v.address is opennebula.deploy.match_address('*:*:*.*', sep='[:.]') -%}
            {{-
              output.append(v | combine({
                "key": v.address | lower,
                "key_type": "pci",
              }))
            -}}
          {%- endif -%}
          {%- if v.address is opennebula.deploy.match_address('*:*:*:*:*:*', sep='[:]') -%}
            {{-
              output.append(v | combine({
                "key": v.address | lower,
                "key_type": "mac",
              }))
            -}}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{- output -}}

- name: Query lspci for devices (1)
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/query.yml"

- when: lspci_devices | count > 0
  block:
    - name: Render sriov-enable service unit
      ansible.builtin.template:
        dest: "{{ item.dest }}"
        src: "{{ item.src }}"
        owner: 0
        group: 0
        mode: "{{ item.mode }}"
      loop:
        - dest: /usr/local/sbin/sriov-manage.sh
          src: sriov-manage.sh.jinja
          mode: u=rwx,go=rx
        - dest: /etc/systemd/system/sriov-enable@.service
          src: sriov-enable@.service.jinja
          mode: u=rw,go=r
      register: template_sriov_enable_service

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: template_sriov_enable_service is changed

    - name: Override drivers (revert when needed)
      ansible.builtin.shell:
        cmd: |
          set -x -o errexit -o pipefail
          BEFORE="$(driverctl list-overrides | sort)" ||:
          {% for v in _to_revert %}
          if grep -E -m1 '^{{ v.Slot }}\s+.*$' <<< "$BEFORE"; then
            driverctl unset-override '{{ v.Slot }}' # revert to the default driver
          fi
          {% endfor %}
          AFTER="$(driverctl list-overrides | sort)" ||:
          if [[ "$AFTER" == "$BEFORE" ]]; then
            exit 0
          else
            exit 78 # EREMCHG
          fi
        executable: /bin/bash
      when: _to_revert | count > 0
      vars:
        _to_revert: >-
          {%- set output = [] -%}
          {%- for v in lspci_devices -%}
            {%- if (v.Ecap_sriov == 'yes') and (v.Set_numvfs == 'max' or v.Set_numvfs | int > 0) -%}
              {{- output.append(v) -}}
            {%- endif -%}
          {%- endfor -%}
          {{- output -}}
      register: shell_revert_drivers
      changed_when:
        - shell_revert_drivers.rc in [78]
      failed_when:
        - shell_revert_drivers.rc not in [0, 78]

    - name: Query lspci for devices (2)
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/query.yml"
      when: shell_revert_drivers is changed

    - name: Enable VFs
      ansible.builtin.shell:
        cmd: |
          set -x -o errexit -o pipefail
          CHANGED=false
          {% for v in _to_enable %}
          {% if v.Set_numvfs == 'max' %}
            SRIOV_NUMVFS="$(head -n1 '/sys/bus/pci/devices/{{ v.Slot }}/sriov_totalvfs')"
          {% elif v.Set_numvfs | int > 0 %}
            SRIOV_NUMVFS='{{ v.Set_numvfs }}'
          {% else %}
            unset SRIOV_NUMVFS
          {% endif %}
            if [[ -n "$SRIOV_NUMVFS" ]]; then
              ALL="$(systemctl show --all -P Id 'sriov-enable@{{ v.Slot }}-*.service' | grep -E -v '^\s*$')" ||:
          {% if v.Set_switchdev == 'yes' %}
              TO_ENABLE="sriov-enable@{{ v.Slot }}-$SRIOV_NUMVFS-switchdev.service"
          {% else %}
              TO_ENABLE="sriov-enable@{{ v.Slot }}-$SRIOV_NUMVFS.service"
          {% endif %}
              if [[ "$(head -n1 '/sys/bus/pci/devices/{{ v.Slot }}/sriov_numvfs')" == 0 ]]; then
                # This handles the invalid case where VFs are no longer enabled but service is still active
                TO_DISABLE="$ALL"
              else
                TO_DISABLE="$(grep -E -v "^$TO_ENABLE$" <<< "$ALL")" ||:
              fi
              if [[ -n "$TO_DISABLE" ]] && systemctl is-active --quiet $TO_DISABLE; then
                systemctl disable --now $TO_DISABLE
                CHANGED=true
              fi
              if ! grep -E -m1 "^$TO_ENABLE$" <<< "$ALL"; then
                # To avoid 'write error: Device or resource busy' during re-enabling
                echo 0 > '/sys/bus/pci/devices/{{ v.Slot }}/sriov_numvfs'
              fi
              if ! systemctl is-active --quiet $TO_ENABLE; then
                systemctl enable --now $TO_ENABLE
                CHANGED=true
              fi
            fi
          {% endfor %}
          if [[ "$CHANGED" == false ]]; then
            exit 0
          else
            exit 78 # EREMCHG
          fi
        executable: /bin/bash
      when: _to_enable | count > 0
      vars:
        _to_enable: >-
          {%- set output = [] -%}
          {%- for v in lspci_devices -%}
            {%- if (v.Ecap_sriov == 'yes') and (v.Set_numvfs == 'max' or v.Set_numvfs | int > 0) -%}
              {{- output.append(v) -}}
            {%- endif -%}
          {%- endfor -%}
          {{- output -}}
      register: shell_enable_vfs
      changed_when:
        - shell_enable_vfs.rc in [78]
      failed_when:
        - shell_enable_vfs.rc not in [0, 78]

    - name: Query lspci for devices (3)
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/query.yml"
      when: shell_enable_vfs is changed

    - name: Release NVIDIA devices (they block NVIDIA driver overrides)
      ansible.builtin.shell:
        cmd: |
          set -x -o errexit -o pipefail
          BEFORE="$(driverctl list-overrides | sort)" ||:
          CHANGED=false
          DAEMON_STOPPED=false
          HELD=''
          {% for v in _nvidia_bound %}
          if ! grep -E -q -m1 '^{{ v.Slot }}\s+{{ v.Set_driver }}$' <<< "$BEFORE"; then
            if systemctl is-active --quiet nvidia-persistenced.service; then
              systemctl stop nvidia-persistenced.service
              echo DAEMON_STOPPED
              DAEMON_STOPPED=true
              CHANGED=true
            fi
            PM="$(nvidia-smi -i '{{ v.Slot }}' --query-gpu=persistence_mode --format=csv,noheader 2>&1)" ||:
            case "$PM" in
              Enabled)
                if nvidia-smi -i '{{ v.Slot }}' -pm 0 1>&2; then
                  CHANGED=true
                else
                  echo "Failed to disable persistence mode of '{{ v.Slot }}'" >&2
                  HELD="$HELD {{ v.Slot }}"
                fi
                ;;
              Disabled)
                ;;
              *)
                # An undetermined persistence mode (NVML mismatch, GPU fallen
                # off the bus, missing nvidia-smi) must NOT pass — kernel-level
                # persistence holds the device with no fd for fuser to see.
                echo "Cannot determine persistence mode of '{{ v.Slot }}': $PM" >&2
                HELD="$HELD {{ v.Slot }}"
                ;;
            esac
            MINOR="$(sed -n 's/^Device Minor:[[:space:]]*//p' '/proc/driver/nvidia/gpus/{{ v.Slot }}/information' 2>/dev/null)" ||:
            if [[ -z "$MINOR" ]]; then
              echo "Cannot determine the /dev/nvidia minor of '{{ v.Slot }}'" >&2
              HELD="$HELD {{ v.Slot }}"
            elif fuser -s "/dev/nvidia$MINOR" 2>/dev/null; then
              # 1>&2 keeps stdout reserved for the DAEMON_STOPPED marker
              fuser -v "/dev/nvidia$MINOR" 1>&2 ||:
              echo "Processes above still hold /dev/nvidia$MINOR ('{{ v.Slot }}')" >&2
              HELD="$HELD {{ v.Slot }}"
            fi
          fi
          {% endfor %}
          if [[ -n "$HELD" ]]; then
            echo "Devices still in use:$HELD — the driver override would hang forever in the NVIDIA driver; stop the holders listed above and re-run." >&2
            if [[ "$DAEMON_STOPPED" == true ]]; then
              systemctl start nvidia-persistenced.service ||: # restore before failing
            elif systemctl is-enabled --quiet nvidia-persistenced.service 2>/dev/null \
                 && ! systemctl is-active --quiet nvidia-persistenced.service; then
              systemctl start nvidia-persistenced.service ||: # heal an inherited orphan
            fi
            exit 16 # EBUSY
          fi
          if [[ "$CHANGED" == false ]]; then
            exit 0
          else
            exit 78 # EREMCHG
          fi
        executable: /bin/bash
      when: _nvidia_bound | count > 0
      vars:
        _nvidia_bound: >-
          {%- set output = [] -%}
          {%- for v in _to_override -%}
            {%- if v.Driver | d('') == 'nvidia' -%}
              {{- output.append(v) -}}
            {%- endif -%}
          {%- endfor -%}
          {{- output -}}
        _to_override: >-
          {%- set output = [] -%}
          {%- for v in lspci_devices -%}
            {%- if (v.Set_driver != 'omit') and ((v.Ecap_sriov == 'no') or (v.Set_numvfs != 'max' and v.Set_numvfs | int == 0)) -%}
              {{- output.append(v) -}}
            {%- endif -%}
          {%- endfor -%}
          {{- output -}}
      register: shell_release_nvidia
      changed_when:
        - shell_release_nvidia.rc in [78]
      failed_when:
        - shell_release_nvidia.rc not in [0, 78]

    - name: Override drivers
      ansible.builtin.shell:
        cmd: |
          set -x -o errexit -o pipefail
          BEFORE="$(driverctl list-overrides | sort)" ||:
          {% for v in _to_override %}
          if ! grep -E -m1 '^{{ v.Slot }}\s+{{ v.Set_driver }}$' <<< "$BEFORE"; then
          {% if v.Ecap_sriov == 'yes' %}
            TO_DISABLE="$(systemctl show --all -P Id 'sriov-enable@{{ v.Slot }}-*.service' | grep -E -v '^\s*$')" ||:
            if [[ -n "$TO_DISABLE" ]] && systemctl is-active --quiet $TO_DISABLE; then
              systemctl disable --now $TO_DISABLE # cleanup spurious sriov-enable@ services
            fi
          {% endif %}
            driverctl set-override '{{ v.Slot }}' '{{ v.Set_driver }}' # force the new driver (vfio-pci by default)
          fi
          {% endfor %}
          AFTER="$(driverctl list-overrides | sort)" ||:
          if [[ "$AFTER" == "$BEFORE" ]]; then
            exit 0
          else
            exit 78 # EREMCHG
          fi
        executable: /bin/bash
      when: _to_override | count > 0
      vars:
        _to_override: >-
          {%- set output = [] -%}
          {%- for v in lspci_devices -%}
            {%- if (v.Set_driver != 'omit') and ((v.Ecap_sriov == 'no') or (v.Set_numvfs != 'max' and v.Set_numvfs | int == 0)) -%}
              {{- output.append(v) -}}
            {%- endif -%}
          {%- endfor -%}
          {{- output -}}
      register: shell_override_drivers
      changed_when:
        - shell_override_drivers.rc in [78]
      failed_when:
        - shell_override_drivers.rc not in [0, 78]

    - name: Query lspci for devices (4)
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/query.yml"
      when: shell_override_drivers is changed

    - name: Start NVIDIA persistence daemon back
      ansible.builtin.shell:
        cmd: |
          set -x -o errexit -o pipefail
          WAS_STOPPED='{{ (shell_release_nvidia.stdout is defined and "DAEMON_STOPPED" in shell_release_nvidia.stdout) | ternary("true", "false") }}'
          if ! systemctl is-active --quiet nvidia-persistenced.service; then
            if systemctl is-enabled --quiet nvidia-persistenced.service 2>/dev/null || [[ "$WAS_STOPPED" == true ]]; then
              systemctl start nvidia-persistenced.service
              exit 78 # EREMCHG
            fi
          fi
          exit 0
        executable: /bin/bash
      register: shell_start_persistenced
      changed_when:
        - shell_start_persistenced.rc in [78]
      failed_when:
        - shell_start_persistenced.rc not in [0, 78]
