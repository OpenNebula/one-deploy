---
- when: inventory_hostname in _lxc_nodes and _lxc_nodes.0 is defined
  vars:
    _lxc_nodes: >-
      {{ (federation.groups.node | map('extract', hostvars)
                                 | selectattr('node_hv', 'defined')
                                 | selectattr('node_hv', 'in', hv_types)
                                 | map(attribute='inventory_hostname')
                                 | list) }}
  block:
    - tags: [preinstall]
      block:
        - ansible.builtin.include_role:
            name: repository
          vars:
            repos_enabled_defaults: [opennebula]
          when: opennebula_repo is undefined

        - name: Install OpenNebula LXC packages
          ansible.builtin.package:
            name: "{{ _common + _specific[ansible_os_family] }}"
          vars:
            _common: [opennebula-node-lxc]
            _specific:
              Debian: []
              RedHat: []
              Suse: []
          register: package
          until: package is success
          retries: 12
          delay: 5

    - ansible.builtin.include_role:
        name: opennebula/leader
      when: leader is undefined

    - name: Slurp oneadmin's pubkey
      ansible.builtin.slurp:
        path: /var/lib/one/.ssh/id_rsa.pub
      register: slurp
      delegate_to: "{{ leader }}"

    - name: Add oneadmin's pubkey to authorized keys
      ansible.posix.authorized_key:
        user: oneadmin
        key: "{{ slurp.content | b64decode }}"

    - delegate_to: "{{ leader }}"
      block:
        - name: Get Nodes
          ansible.builtin.command:
            cmd: onehost list --json
          changed_when: false
          register: command_onehost_list
          when: inventory_hostname == _lxc_nodes.0 # `run_once: true` cannot be used here

        - name: Add / Update this LXC Node
          ansible.builtin.shell:
            cmd: "{{ _actions[_action].cmd }}"
            stdin: "{{ _actions[_action].stdin }}"
            executable: /bin/bash
          changed_when: true
          when: _actions[_action].when | d(true)
          vars:
            _hv: >-
              {{ node_hv | lower }}

            _host_pool: >-
              {{ (hostvars[_lxc_nodes.0].command_onehost_list.stdout | from_json).HOST_POOL }}

            _this: >-
              {{ ansible_host | d(inventory_hostname) }}

            # NOTE: The `[] | flatten` operation is not necessary here really,
            #       but we stay paranoid..
            _template: >-
              {{ ([_host_pool.HOST] | flatten
                                    | selectattr('NAME', '==', _this)
                                    | first
                                    | d({})).TEMPLATE }}

            _before: >-
              {{ _template | d({}) | combine({"NAME": none}) }}

            _after: >-
              {{ _template | d({}) | combine(onehost.template) | combine({"NAME": none}) }}

            _action: >-
              {{ _template is undefined | ternary('CREATE', 'UPDATE') }}

            _actions:
              CREATE:
                cmd: |
                  set +o errexit -o pipefail

                  onehost create '{{ _this }}' -i '{{ hv_types[_hv].im_mad }}' -v '{{ hv_types[_hv].vmm_mad }}'; RC="$?"

                  if [[ "$RC" -eq 0 ]]; then
                      TEMPLATE="$(mktemp)"; tee "$TEMPLATE"

                      cat "$TEMPLATE" | onehost update '{{ _this }}' "$TEMPLATE"; RC="$?"

                      rm -f "$TEMPLATE"
                  fi

                  exit "$RC"
                stdin: >-
                  {{ _after | opennebula.deploy.to_one }}
              UPDATE:
                cmd: |
                  set +o errexit -o pipefail

                  TEMPLATE="$(mktemp)"; tee "$TEMPLATE"

                  cat "$TEMPLATE" | onehost update '{{ _this }}' "$TEMPLATE"; RC="$?"

                  rm -f "$TEMPLATE"

                  exit "$RC"
                stdin: >-
                  {{ _after | opennebula.deploy.to_one }}
                when: >-
                  {{ _after | opennebula.deploy.to_one != _before | opennebula.deploy.to_one }}
