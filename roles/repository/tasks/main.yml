---
- when: _repos_enabled | count > 0
  vars:
    _repos_enabled: >-
      {{ repos_enabled | d(repos_enabled_defaults) | intersect(repos_enabled_defaults) }}
  block:
    - name: Install dependencies (TRY)
      ansible.builtin.package:
        name: "{{ _common + (_specific[_d][_v] | d(_default[_f])) }}"
      vars:
        _common: [ca-certificates, jq]
        _specific:
          Debian:
            '13': [apt-transport-https, dirmngr, gnupg2]
        _default:
          Debian: [apt-transport-https, dirmngr, gnupg2, software-properties-common]
          RedHat: [gnupg2]
          Suse: [gpg2]
        _d: "{{ ansible_distribution }}"
        _v: "{{ ansible_distribution_major_version }}"
        _f: "{{ ansible_os_family }}"
      # NOTE: This allows for some limited recovery if re-executed, it is likely
      #       required packages are already installed.
      ignore_errors: true # noqa ignore-errors

    - ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/{{ _item }}.yml"
      when:
        - repo_constraints[_item].condition
        - inventory_hostname in repo_constraints[_item].hosts
      loop: "{{ _repos_enabled }}"
      loop_control: { loop_var: _item }

    - name: Update package manager cache
      ansible.builtin.package:
        name: []
        update_cache: "{{ _changed is any }}"
      vars:
        # Gather all existing results from repo config rendering.
        _changed: >-
          {{ _repos_enabled | map('regex_replace', '^(.*)$', '\g<1>_repo')
                            | map('extract', hostvars[inventory_hostname], ['changed'])
                            | map('default', false) }}

# NOTE: EL9 default Ruby is 3.0, newer OpenNebula packages are built against
#       a Ruby available only as a module stream (e.g. ruby:3.3). The stream has
#       to be enabled before the packages are installed or upgraded, detect it
#       from the dependencies of the bundled Ruby gems in the configured repos.
- when:
    - ansible_os_family == 'RedHat'
    - ansible_distribution_major_version == '9'
  block:
    - name: Detect Ruby required by OpenNebula packages
      ansible.builtin.command:
        cmd: dnf -q --refresh repoquery --latest-limit 1 --requires opennebula-rubygems
      changed_when: false
      register: repoquery_rubygems
      until: repoquery_rubygems is success
      retries: 12
      delay: 5

    - name: Enable Ruby module stream
      ansible.builtin.command:
        cmd: dnf module enable -y ruby:{{ _ruby_stream }}
      when:
        - _ruby_stream is truthy
        - _ruby_stream is version('3.0', '>')
      vars:
        _ruby_stream: >-
          {{ repoquery_rubygems.stdout | regex_search('libruby\.so\.(\d+\.\d+)', '\1') | d([], true) | first | d('') }}
      register: module_enable_ruby
      changed_when: "'Nothing to do.' not in module_enable_ruby.stdout"
