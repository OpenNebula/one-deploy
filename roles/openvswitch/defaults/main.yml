---
ovs_defaults:
  iface: {}
  bond: {}
  br: {}
  port: {}

ovs_packages:
  AlmaLinux:
    - ethtool
    - iproute
    - iputils
    - openvswitch3.5
  Debian:
    - ethtool
    - iproute2
    - iputils-arping
    - openvswitch-switch
  RedHat:
    - ethtool
    - iproute
    - iputils
    - openvswitch3.6
  Suse:
    - ethtool
    - iproute2
    - iputils
    - openvswitch

ovs_packages_dpdk:
  AlmaLinux:
    - dpdk-tools
    - ethtool
    - iproute
    - iputils
    - openvswitch3.5
  Debian:
    - ethtool
    - iproute2
    - iputils-arping
    - openvswitch-switch-dpdk
  RedHat:
    - dpdk-tools
    - ethtool
    - iproute
    - iputils
    - openvswitch3.6
  Suse:
    - dpdk-tools
    - ethtool
    - iproute2
    - iputils
    - openvswitch

# SELinux userspace tools required to build/load the custom "dpdk_virt" policy module:
# checkmodule (checkpolicy), semodule/semodule_package (policycoreutils), semanage (policycoreutils-python-utils).
ovs_packages_selinux:
  RedHat:
    - checkpolicy
    - policycoreutils
    - policycoreutils-python-utils
  Suse:
    - checkpolicy
    - policycoreutils
    - policycoreutils-python-utils
