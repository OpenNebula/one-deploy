---
- vars:
    _selinux_os:
      Debian: false
      RedHat: true
      Suse: true
    _has_selinux: >-
      {{ _selinux_os[ansible_distribution] | d(_selinux_os[ansible_os_family]) }}
  block:
    - name: Ensure /var/run/one/vhost-socks/ exists (copy)
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/10-one-vhost-socks.conf
        owner: 0
        group: 0
        mode: u=rwx,go=rx
        content: |
          # managed by one-deploy
          # Type Path                      Mode User Group Age Argument
          d      /var/run/one/             0770 9869 9869  -   -
          d      /var/run/one/vhost-socks/ 0770 9869 9869  -   -
      register: copy_vhost_socks_conf

    - name: Ensure /var/run/one/vhost-socks/ exists (shell)
      ansible.builtin.shell:
        cmd: "{{ item.cmd }}"
        executable: /bin/bash
      changed_when: true
      when:
        - copy_vhost_socks_conf is changed
        - item.when
      loop:
        - when: "{{ _has_selinux }}"
          cmd: >-
            semanage fcontext -a -t virt_var_run_t '/run/one/vhost-socks(/.*)?'
            ||
            semanage fcontext -a -t virt_var_run_t '/var/run/one/vhost-socks(/.*)?'

        - when: "{{ true }}"
          cmd: systemd-tmpfiles --create /etc/tmpfiles.d/10-one-vhost-socks.conf

    - name: Check if user 'openvswitch' exists
      ansible.builtin.getent:
        database: passwd
        key: openvswitch
        fail_key: false

    - when: _has_openvswitch_user
      vars:
        _has_openvswitch_user: >-
          {{ ansible_facts.getent_passwd.openvswitch is not none }}
      block:
        - name: Install SELinux policy tools (checkmodule, semodule, semanage)
          ansible.builtin.package:
            name: "{{ ovs_packages_selinux[ansible_distribution] | d(ovs_packages_selinux[ansible_os_family]) }}"
          register: package
          until: package is success
          retries: 12
          delay: 5
          when: _has_selinux

        - name: Create custom SELinux policy for DPDK / Libvirt shared sockets
          ansible.builtin.shell:
            cmd: |
              set -o errexit
              TDIR="$(mktemp -d)" && trap "rm -rf $TDIR" EXIT ERR
              tee "$TDIR/dpdk_virt.te"
              if (cd "$TDIR" && semodule -E dpdk_virt); then
                BEFORE="$(cksum $TDIR/dpdk_virt.pp)"
              else
                BEFORE=""
              fi
              checkmodule -M -m -o "$TDIR/dpdk_virt.mod" "$TDIR/dpdk_virt.te"
              semodule_package -o "$TDIR/dpdk_virt.pp" -m "$TDIR/dpdk_virt.mod"
              AFTER="$(cksum $TDIR/dpdk_virt.pp)"
              if [[ "$AFTER" == "$BEFORE" ]]; then
                exit 0
              else
                semodule -i "$TDIR/dpdk_virt.pp"
                exit 78 # EREMCHG
              fi
            stdin: |
              module dpdk_virt 1.1;
              require {
                  type openvswitch_t;
                  type virt_var_run_t;
                  type svirt_t;
                  type svirt_tmpfs_t;
                  class dir { search getattr read open };
                  class sock_file { write getattr append unlink };
                  class file { map getattr };
              }
              allow openvswitch_t virt_var_run_t:dir { search getattr read open };
              allow openvswitch_t virt_var_run_t:sock_file { write getattr append };
              allow svirt_t virt_var_run_t:sock_file unlink;
              allow openvswitch_t svirt_tmpfs_t:file { map getattr };
            executable: /bin/bash
          register: shell_dpdk_virt
          changed_when:
            - shell_dpdk_virt.rc in [78]
          failed_when:
            - shell_dpdk_virt.rc not in [0, 78]
          when: _has_selinux

        - name: Add ACLs for /var/run/one/vhost-socks/ (copy)
          ansible.builtin.copy:
            dest: /etc/tmpfiles.d/11-one-vhost-socks-acls.conf
            owner: 0
            group: 0
            mode: u=rwx,go=rx
            content: |
              # managed by one-deploy
              # Type Path                      Mode User Group Age Argument
              a+     /var/run/one/             -    -    -     -   user:openvswitch:r-x
              a+     /var/run/one/vhost-socks/ -    -    -     -   user:openvswitch:rwx
              a+     /var/run/one/vhost-socks/ -    -    -     -   default:user:openvswitch:rwx
          register: copy_vhost_socks_acls_conf

        - name: Add ACLs for /var/run/one/vhost-socks/ (command)
          ansible.builtin.command:
            cmd: "{{ item.cmd }}"
          changed_when: true
          when:
            - copy_vhost_socks_acls_conf is changed
            - item.when
          loop:
            - when: "{{ true }}"
              cmd: systemd-tmpfiles --create /etc/tmpfiles.d/11-one-vhost-socks-acls.conf
