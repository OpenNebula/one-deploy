---
- ansible.builtin.include_role:
    name: opennebula/leader
  when: leader is undefined

- when: inventory_hostname == leader and (usergroups | d(none)) is not none
  block:
    - when: usergroups.groups | d(none) is not none
      block:
        - name: Get groups
          ansible.builtin.shell:
            cmd: onegroup list --json
            executable: /bin/bash
          changed_when: false
          register: shell

        - name: Parse groups
          ansible.builtin.set_fact:
            onegroups: >-
              {{ shell.stdout | from_json }}

        - name: Create groups
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              onegroup create {{ item }} \
              {{ '--resources ' ~ usergroups.groups[item].resources
                if (usergroups.groups[item].resources | d(none)) }} \
              {{ '--admin_user ' ~ usergroups.groups[item].admin_user ~
                 ' --admin_password ' ~ usergroups.groups[item].admin_password
                 if (usergroups.groups[item].admin_user | d(none)
                    and usergroups.groups[item].admin_password | d(none)) }} \
              {{ '--admin_driver ' ~ usergroups.groups[item].admin_driver
                 if (usergroups.groups[item].admin_driver | d(none)) }}
          changed_when: false
          loop: >-
            {{ _defined_groups | reject('in', _existing_groups) }}
          vars:
            _defined_groups: >-
              {{ usergroups.groups.keys() | list }}
            _existing_groups: >-
              {{ onegroups.GROUP_POOL.GROUP | map(attribute='NAME') | list }}

    - when: (usergroups.users | d(none)) is not none
      block:
        - name: Get users
          ansible.builtin.shell:
            cmd: oneuser list --json
            executable: /bin/bash
          changed_when: false
          register: shell

        - name: Parse users
          ansible.builtin.set_fact:
            oneusers: >-
              {{ shell.stdout | from_json }}

        - name: Create users
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              oneuser create {{ item }} \
              {{ usergroups.users[item].password | d(none) }} \
              {{ '--group ' ~ usergroups.users[item].groups
                if (usergroups.users[item].groups | d(none)) }} \
              {{ '--driver ' ~ usergroups.users[item].driver
                if (usergroups.users[item].driver | d(none)) }}
          changed_when: false
          loop: >-
            {{ _defined_users | reject('in', _existing_users) }}
          when:
            - (usergroups.users[item].password | d(none) is not none)
              or (usergroups.users[item].driver | d(none) is not none
              and (usergroups.users[item].driver | d(none) != "core"))
          vars:
            _defined_users: >-
              {{ usergroups.users.keys() | list }}
            _existing_users: >-
              {{ oneusers.USER_POOL.USER | map(attribute='NAME') | list }}
