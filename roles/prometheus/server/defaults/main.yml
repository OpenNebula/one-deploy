---
oneprometheus_config_defaults:
  prometheus: |
    ---
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    {% set c = _components | selectattr('key', '==', 'opennebula-alertmanager') | first %}
    {% if c.value.enabled is sameas(true) %}
    alerting:
      alertmanagers:
        - file_sd_configs:
            - files:
                - /etc/one/prometheus/targets/{{ c.value.short }}.yml
    {% endif %}

    rule_files:
    {% for r in _rules %}
      - /etc/one/prometheus/{{ r.key }}
    {% endfor %}

    scrape_configs:
    {% for c in _components | rejectattr('value.job', 'none') %}
      - job_name: {{ c.value.job }}
        file_sd_configs:
          - files:
              - /etc/one/prometheus/targets/{{ c.value.short }}.yml
    {% endfor %}
  alertmanager: |
    ---
    global:
      resolve_timeout: 5m

    route:
      group_by: [alertname]
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 1h
      receiver: discard

    receivers:
      - name: discard

    templates: []

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: [alertname, dev, instance]
