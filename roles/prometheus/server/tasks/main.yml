---
- tags: [preinstall]
  block:
    - ansible.builtin.include_role:
        name: repository
      vars:
        repos_enabled_defaults: [opennebula]
      when: opennebula_repo is undefined

    - name: Install Prometheus with dependencies
      ansible.builtin.package:
        name: "{{ _common }}"
      vars:
        _common: [bash, opennebula-prometheus]
      register: package
      until: package is success
      retries: 12
      delay: 5

- ansible.builtin.import_tasks:
    file: "{{ role_path }}/tasks/prometheus.yml"

- ansible.builtin.import_tasks:
    file: "{{ role_path }}/tasks/alertmanager.yml"
