---
- tags: [preinstall]
  block:
    - ansible.builtin.include_role:
        name: repository
      vars:
        repos_enabled_defaults: [grafana, opennebula]
      when: grafana_repo is undefined or opennebula_repo is undefined

- ansible.builtin.include_role:
    name: opennebula/leader
  when: leader is undefined

- when: _component.enabled is sameas(true) and inventory_hostname in _component.targets
  vars:
    _component: >-
      {{ oneprometheus_components['grafana-server'] }}
  block:
    - name: Install Grafana with dependencies
      ansible.builtin.package:
        name: "{{ _common + _specific[ansible_os_family] }}"
      vars:
        _common: [bash, grafana, opennebula-prometheus]
        _specific:
          Debian: []
          RedHat: []
          Suse: []
      register: package
      until: package is success
      retries: 12
      delay: 5
      tags: [preinstall]

    - block:
        - name: Override systemd unit (file)
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ _component.service }}.d/"
            state: directory
            owner: 0
            group: 0
            mode: u=rwx,go=rx

        - name: Override systemd unit (template)
          ansible.builtin.template:
            dest: "/etc/systemd/system/{{ _component.service }}.d/override.conf"
            src: "{{ role_path }}/../common/templates/{{ _component.service }}.jinja"
            owner: 0
            group: 0
            mode: u=rw,go=r
          register: template_override_unit

    - name: Update Grafana provisioning
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: 0
        group: grafana
        mode: u=rw,go=r
      loop: "{{ _loop }}"
      vars:
        _loop:
          - dest: /etc/grafana/provisioning/datasources/prometheus.yml
            content: |
              apiVersion: 1
              datasources:
              - name: prometheus
                type: prometheus
                access: proxy
                url: "http://{{ one_vip | d(leader) }}:9090"
                isDefault: true
                editable: false
          - dest: /etc/grafana/provisioning/dashboards/opennebula.yml
            content: |
              apiVersion: 1
              providers:
              - name: opennebula
                type: file
                folder: ONE
                options: { path: /usr/share/one/grafana/dashboards/ }
      register: copy_grafana_provisioning

    - name: Enable / Start / Restart Grafana service (NOW)
      ansible.builtin.systemd_service:
        name: "{{ _component.service }}"
        enabled: true
        state: >-
          {{ _changed | ternary('restarted', 'started') }}
        daemon_reload: >-
          {{ _changed }}
      vars:
        _changed: >-
          {{ [ template_override_unit is changed
             , copy_grafana_provisioning is changed ] is any }}
