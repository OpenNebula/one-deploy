---
- tags: [preinstall]
  block:
    - ansible.builtin.include_role:
        name: repository
      vars:
        repos_enabled_defaults: [grafana, opennebula]
      when: grafana_repo is undefined or opennebula_repo is undefined

    - name: Install Grafana with dependencies
      ansible.builtin.package:
        name: "{{ _common + _specific[ansible_os_family] }}"
      vars:
        _common: [bash, grafana, opennebula-prometheus]
        _specific:
          Debian: []
          RedHat: []
          Suse: []
      register: package
      until: package is success
      retries: 12
      delay: 5

- ansible.builtin.include_role:
    name: opennebula/leader
  when: leader is undefined

- vars:
    _components: >-
      {{ oneprometheus_components | dict2items
                                  | selectattr('value.condition', 'sameas', true)
                                  | list }}
    _services: >-
      {{ _components | selectattr('key', 'in', ['grafana-server'])
                     | list }}
    _services_local: >-
      {{ _services | selectattr('value.targets', 'contains', inventory_hostname)
                   | list }}
  block:
    - block:
        - name: Override systemd units (file)
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ item.value.service }}.d/"
            state: directory
            owner: 0
            group: 0
            mode: u=rwx,go=rx
          loop: "{{ _services_local }}"
          loop_control: { label: "{{ item.key }}" }

        - name: Override systemd units (template)
          ansible.builtin.template:
            dest: "/etc/systemd/system/{{ item.value.service }}.d/override.conf"
            src: "{{ role_path }}/../common/templates/{{ item.value.service }}.jinja"
            owner: 0
            group: 0
            mode: u=rw,go=r
          loop: "{{ _services_local }}"
          loop_control: { label: "{{ item.key }}" }
          register: template_override_units

    - name: Update Grafana provisioning
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: 0
        group: grafana
        mode: u=rw,go=r
      loop: "{{ _loop }}"
      vars:
        _loop:
          - dest: /etc/grafana/provisioning/datasources/prometheus.yml
            content: |
              apiVersion: 1
              datasources:
              - name: prometheus
                type: prometheus
                access: proxy
                url: "http://{{ one_vip | d(leader) }}:9090"
                isDefault: true
                editable: false
          - dest: /etc/grafana/provisioning/dashboards/opennebula.yml
            content: |
              apiVersion: 1
              providers:
              - name: opennebula
                type: file
                folder: ONE
                options: { path: /usr/share/one/grafana/dashboards/ }
      register: copy_grafana_provisioning

    - name: Enable / Start / Restart Grafana services (NOW)
      ansible.builtin.systemd_service:
        name: "{{ item.value.service }}"
        enabled: true
        state: >-
          {{ _changed | ternary('restarted', 'started') }}
        daemon_reload: >-
          {{ _changed }}
      loop: "{{ _services_local }}"
      loop_control: { label: "{{ item.key }}" }
      vars:
        _changed: >-
          {{ [ template_override_units is changed
             , copy_grafana_provisioning is changed ] is any }}
