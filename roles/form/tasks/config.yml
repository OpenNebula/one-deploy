---
- name: Configure OneForm Server (:server/:bind)
  opennebula.deploy.cfgtool:
    dest: /etc/one/oneform-server.conf
    parser: Yaml
    actions:
      - put:
          path: >-
            {{ [':server', ':bind']
               if one_version is version('7.5.80', '>=') else
               [':host'] }}
          value: >-
            {{ form_bind_addr }}
  notify:
    - Restart OneForm Server
