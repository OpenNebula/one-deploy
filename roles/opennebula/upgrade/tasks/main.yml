---
- when: inventory_hostname in federation.groups.all
  vars:
    _fe_remotes_dir: >-
      /var/lib/one/remotes/
    _hv_remotes_dir: >-
      {{ '/var/lib/one-remotes/'
         if one_version is version('7.5.80', '>=') else
         '/var/tmp/one/' }}
    _remotes_dir: >-
      {{ _fe_remotes_dir
         if (inventory_hostname in federation.groups.frontend) else
         _hv_remotes_dir }}
  block:
    - name: Slurp OpenNebula version
      ansible.builtin.slurp:
        path: "{{ _remotes_dir }}/VERSION"
      register: slurp_one_version

    - when: one_version is version(_version, '>')
      vars:
        _version: >-
          {{ slurp_one_version.content | b64decode | trim }}
      block:
        - ansible.builtin.include_role:
            name: opennebula/leader
          when: leader is undefined

        - ansible.builtin.include_tasks:
            file: "{{ role_path }}/tasks/stop.yml"

        - ansible.builtin.include_tasks:
            file: "{{ role_path }}/tasks/apply.yml"

        - ansible.builtin.include_tasks:
            file: "{{ role_path }}/tasks/start.yml"
