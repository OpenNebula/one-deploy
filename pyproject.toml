[project]
name = "one-deploy"
version = "0.0.0"
description = "OpenNebula Ansible Playbooks"
authors = ["OpenNebula <contact@opennebula.io>"]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"

[tool.hatch.envs.default]
skip-install = true
installer = "uv"
dependencies = [
  "ansible-core<2.17",
  "ansible-lint",
  "molecule",
  "netaddr",
  "pyone",
  "six",
  "xmltodict",
]
# NOTE: If you experience more dynamic linker issues in your OS,
#       you may want to extend LD_LIBRARY_PATH further.
env-vars = { LD_LIBRARY_PATH = "/run/current-system/sw/share/nix-ld/lib" }
